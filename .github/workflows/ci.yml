name: CI Quality Gate

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:


jobs:
  validate:
    name: Build, Lint & Test Full Stack
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: short_factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter "@short-factory/contracts" build

      - name: Generate Prisma Client
        run: pnpm --filter "@short-factory/api" prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/short_factory?schema=public

      - name: Push Database Schema
        run: pnpm --filter "@short-factory/api" prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/short_factory?schema=public

      - name: Seed Database
        run: pnpm --filter "@short-factory/api" ts-node src/infrastructure/database/prisma/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/short_factory?schema=public

      - name: Type Check Monorepo
        run: |
          pnpm --filter "@short-factory/contracts" typecheck
          pnpm --filter "@short-factory/api" typecheck
          pnpm --filter "@short-factory/web" typecheck

      - name: Run Backend Unit & E2E Tests
        run: |
          pnpm --filter "@short-factory/api" test
          pnpm --filter "@short-factory/api" test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/short_factory?schema=public
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Run Frontend Tests
        run: pnpm --filter "@short-factory/web" test

      - name: Build Production Bundles
        run: |
          pnpm --filter "@short-factory/api" build
          pnpm --filter "@short-factory/web" build

  docker-release:
    name: Build & Push to Docker Hub (${{ matrix.service }})
    needs: [validate]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image_name: short-factory-api
            dockerfile: apps/api/Dockerfile
          - service: web
            image_name: short-factory-web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

